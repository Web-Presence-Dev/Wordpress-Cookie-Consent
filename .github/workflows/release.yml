# Builds webpresence-cookie-consent.zip and attaches it to the GitHub release
# when a version tag (v1.2.3) is pushed. Sites pick it up through the plugin's
# built-in updater (src/Updater/GitHubUpdater.php).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' webpresence-cookie-consent.php | awk '{print $NF}')
          CONSTANT=$(grep -m1 "define('WPCC_VERSION'" webpresence-cookie-consent.php | sed -E "s/.*'([^']+)'\);/\1/")
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "tag=$TAG header=$HEADER constant=$CONSTANT stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONSTANT" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag v$TAG doesn't match Version ($HEADER), WPCC_VERSION ($CONSTANT) and Stable tag ($STABLE)"
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: |
          mkdir -p build/webpresence-cookie-consent
          rsync -a --exclude-from=.distignore --exclude=build ./ build/webpresence-cookie-consent/
          cd build && zip -rq webpresence-cookie-consent.zip webpresence-cookie-consent

      - name: Release notes from readme.txt
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^= "v" =$" {found=1; next}
            found && /^= / {exit}
            found {print}
          ' readme.txt > build/notes.md
          cat build/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/webpresence-cookie-consent.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/webpresence-cookie-consent.zip \
              --title "$GITHUB_REF_NAME" --notes-file build/notes.md
          fi
